spring.application.name=prijava-neusaglasenosti
server.port=8080

# H2 baza u fajlu ./data/prijave (podaci ostaju i nakon restarta)
spring.datasource.url=jdbc:h2:file:./data/prijave;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# H2 konzola za pregled baze: http://localhost:8080/h2-console
spring.h2.console.enabled=true

# Veličina uploada (slike sa telefona)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
